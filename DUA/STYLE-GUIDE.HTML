<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Mini Style Guide</title>
</head>
<body>
  <h1 style="font-family: Arial, sans-serif; font-size: 50px; color:#17633f; line-height:1.7;">
    Opsi 1
  </h1>
  <p style="font-family: Georgia, serif; font-size:18px; color:#ace22f;">
    Font utama: Arial, sans-serif <br>
    Font aksen: Georgia, serif <br>
    Warna utama: #17633f <br>
    Warna aksen: #ff4747 <br>
    Heading H1: 50px <br>
    Line height: 1.7
  </p>

  <h1 style="font-family: Helvetica, sans-serif; font-size: 48px; color:#1f1ce0; line-height:1.6;">
    Opsi 2
  </h1>
  <p style="font-family: Courier New, monospace; font-size:18px; color:#9c19d8;">
    Font utama: Helvetica, sans-serif <br>
    Font aksen: Courier New, monospace <br>
    Warna utama: #2a0c69 <br>
    Warna aksen: #c61b8d <br>
    Heading H1: 48px <br>
    Line height: 1.6
  </p>
</body>
</html>
